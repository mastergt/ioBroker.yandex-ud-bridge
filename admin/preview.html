<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" type="text/css" href="../../css/adapter.css">
<link rel="stylesheet" type="text/css" href="../../lib/css/materialize.css">
<script src="../../lib/js/jquery-3.2.1.min.js"></script>
<script src="../../socket.io/socket.io.js"></script>
<script src="../../js/translate.js"></script>
<script src="../../lib/js/materialize.js"></script>
<script src="../../js/adapter-settings.js"></script>
<link rel="stylesheet" href="editor.css">
<script src="editor.js"></script>
</head>
<body>
<div class="m adapter-container bridge-root">
  <aside class="rail">
    <div class="brand"><div class="brand-icon">⌂</div><div><b>Яндекс · Bridge</b><small>Устройства ioBroker</small></div></div>
    <button class="nav is-selected" data-view="devices">▦ &nbsp; Устройства</button>
    <button class="nav" data-view="server">◉ &nbsp; Сервер и HTTPS</button>
    <button class="nav" data-view="auth">♙ &nbsp; Авторизация</button>
    <button class="nav" data-view="diagnostic">◈ &nbsp; Проверка</button>
    <button class="nav" data-view="migration">⇢ &nbsp; Импорт config.js</button>
    <button class="nav" data-view="advanced">⚙ &nbsp; Дополнительно</button>
    <div class="rail-foot"><span class="pulse"></span> Локальный адаптер<br><small>Никакого yandex2mqtt</small></div>
  </aside>
  <main class="workspace">
    <header class="topbar"><div><div class="eyebrow" id="breadcrumb">МОИ УСТРОЙСТВА</div><h1 id="page-heading">Устройства</h1><p id="page-subtitle">Управляйте тем, что увидит Алиса</p></div><div id="top-action"></div></header>
    <div class="notice" id="notice" role="status" hidden></div>
    <section id="content" aria-live="polite"></section>
    <div class="bottom-hint" id="save-hint">Изменения применяются после кнопки «Сохранить» в окне ioBroker.</div>
  </main>
</div>
<input id="config-file" type="file" accept=".js,.txt,text/plain,application/javascript" hidden>
<datalist id="state-suggestions"></datalist>
<script>window.addEventListener('load',()=>{load({listenHost:'127.0.0.1',listenPort:8096,oauthUserId:'1',devices:[{id:'window-bedroom-sensor',name:'Окно в спальне',room:'Спальня',type:'devices.types.sensor.open',enabled:true},{id:'light-kitchen',name:'Основной свет',room:'Кухня',type:'devices.types.light',enabled:true},{id:'curtain-living',name:'Шторы',room:'Гостиная',type:'devices.types.openable.curtain',enabled:true},{id:'vacuum',name:'Робот-пылесос',room:'Кухня',type:'devices.types.vacuum_cleaner',enabled:true},{id:'camera-entrance',name:'Камера у входа',room:'Вход',type:'devices.types.camera',enabled:true}],bindings:[{deviceId:'light-kitchen',enabled:true,kind:'capability',type:'on_off',instance:'on',stateId:'zigbee.0.light.state',commandId:'zigbee.0.light.state'}]},()=>{});});</script></body>
</html>
