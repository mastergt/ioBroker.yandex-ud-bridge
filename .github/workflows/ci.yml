name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
      - name: Validate npm package content
        run: npm pack --dry-run --json > /tmp/npm-pack-list.json
  package:
    name: ioBroker package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate ioBroker package files
        run: npm run test:package
  integration:
    name: ioBroker js-controller integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install and start adapter in isolated js-controller harness
        run: npm run test:integration

  repository-checker:
    name: Repository checker (advisory until npm publication)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run official ioBroker repository checker
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          npx --yes @iobroker/repochecker@latest "https://github.com/mastergt/ioBroker.yandex-ud-bridge" "$TARGET_BRANCH" 2>&1 | tee repochecker.log
      - name: Upload checker findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repochecker-report
          path: repochecker.log
          if-no-files-found: ignore
