name: Test and Release

# Standard ioBroker checks and cross-platform adapter tests.
# Release tags stage an npm package for manual 2FA approval; ordinary pushes never publish.
on:
  push:
    # "*" matches root-level branch names; "**" also matches branches with slashes.
    branches: ['main', '*', '**']
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request: {}

permissions:
  contents: read

# Match the official ioBroker template; cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '24.x'
          install-command: 'npm install --no-audit --no-fund'
          package-cache: 'false'
          # ESLint isn't configured yet; package validation still runs here.
          lint: 'false'

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          install-command: 'npm install --no-audit --no-fund'
          package-cache: 'false'

  # Keep the deploy job name for ioBroker Repository Checker.
  # Only a pushed version tag can stage a package after all checks pass.
  # Trusted Publisher on npm is stage-only; final release needs manual 2FA approval.
  deploy:
    needs: [check-and-lint, adapter-tests]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # npm stage requires npm >= 11.15.0 (Node >= 22.14.0).
      - name: Install npm with staged publishing support
        run: npm install --global npm@^11

      - name: Check that the release tag matches package versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          node -e 'const fs=require("fs"); const pkg=require("./package.json"); const io=require("./io-package.json"); const expected=process.argv[1]; if(pkg.version!==expected || io.common.version!==expected){console.error("Version mismatch: tag="+expected+", package="+pkg.version+", io="+io.common.version);process.exit(1)}' "$VERSION"
          npm --version

      - name: Stage npm package with trusted publishing and provenance
        run: npm stage publish --provenance
